<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./portal.html">
  <title>LLLD Works Hub | 社内ポータル</title>
  <meta name="description" content="LLLD Works Hubの社内ポータル入口です。">
  <style>
    :root{
      color-scheme:light;
      --navy:#061829;
      --teal:#12b8ab;
      --bg:#f2f5f9;
      --line:#dce3ed;
      --text:#2b3850;
      --muted:#6d7b92;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    }
    *{box-sizing:border-box}
    body{
      min-height:100vh;
      margin:0;
      display:grid;
      grid-template-rows:auto 1fr;
      place-items:center;
      background:var(--bg);
      color:var(--text);
      font-family:var(--font);
      line-height:1.7;
    }
    .site-header{
      width:100%;
      height:64px;
      min-height:64px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      flex-wrap:nowrap;
      gap:8px;
      padding:0 clamp(12px,1.5vw,20px);
      background:var(--navy);
      color:#fff;
      overflow:visible;
    }
    .brand{
      margin-right:auto;
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:#fff;
      font-weight:800;
      text-decoration:none;
      white-space:nowrap;
    }
    .brand .mark{
      width:30px;
      height:30px;
      margin:0;
      flex:0 0 30px;
    }
    .site-nav{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      flex-wrap:nowrap;
      margin-left:auto;
    }
    .site-nav a,
    .notice-button,
    .page-menu summary{
      min-height:36px;
      height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,255,255,.23);
      border-radius:8px;
      background:transparent;
      color:#fff;
      padding:0 12px;
      font-weight:700;
      text-decoration:none;
      line-height:1;
    }
    .site-nav a[href="./portal.html"]{
      background:var(--teal);
      border-color:transparent;
    }
    .notice-button{
      width:36px;
      flex:0 0 36px;
      padding:0;
      border-radius:999px;
      cursor:pointer;
    }
    .notice-button:before{
      content:"";
      width:15px;
      height:15px;
      border:2px solid currentColor;
      border-top-color:transparent;
      border-radius:50% 50% 45% 45%;
    }
    .page-menu{
      position:relative;
    }
    .page-menu summary{
      list-style:none;
      cursor:pointer;
    }
    .page-menu summary::-webkit-details-marker{display:none}
    .page-menu-list{
      position:absolute;
      top:calc(100% + 8px);
      right:0;
      min-width:220px;
      border:1px solid rgba(15,35,58,.12);
      border-radius:12px;
      background:#fff;
      box-shadow:0 20px 40px rgba(6,27,50,.18);
      padding:6px;
      text-align:left;
    }
    .page-menu-list span,
    .page-menu-list a,
    .page-menu-list button{
      display:flex;
      width:100%;
      min-height:36px;
      align-items:center;
      padding:0 10px;
      border:0;
      border-radius:8px;
      background:transparent;
      color:#0f1b2e;
      font:inherit;
      font-weight:700;
      text-align:left;
      text-decoration:none;
    }
    .page-menu-list span{
      color:#6d7b92;
      border-bottom:1px solid #eef2f7;
    }
    .page-menu-list a:hover,
    .page-menu-list button:hover{background:#eef6ff}
    main{
      width:min(520px,100%);
      padding:28px;
      margin:24px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      box-shadow:0 14px 34px rgba(6,24,41,.08);
      text-align:center;
    }
    .mark{
      width:42px;
      height:42px;
      margin:0 auto 14px;
      border-radius:12px;
      background:linear-gradient(135deg,#3acde8,var(--teal));
    }
    h1{
      margin:0 0 8px;
      color:var(--navy);
      font-size:1.7rem;
      line-height:1.3;
    }
    p{margin:0 0 18px;color:var(--muted)}
    a{
      display:inline-flex;
      min-height:42px;
      align-items:center;
      justify-content:center;
      padding:0 18px;
      border-radius:10px;
      background:var(--teal);
      color:#fff;
      font-weight:700;
      text-decoration:none;
    }
    main a{
      border-radius:10px;
      background:var(--teal);
    }
    @media(max-width:720px){
      .site-header{
        overflow-x:auto;
        overflow-y:visible;
        -webkit-overflow-scrolling:touch;
      }
      .brand{
        max-width:46vw;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .site-nav{justify-content:flex-end}
    }
  </style>
  <script>
    window.location.replace("./portal.html");
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./portal.html"><span class="mark" aria-hidden="true"></span>LLLD Works Portal</a>
    <nav class="site-nav" aria-label="共通導線">
      <button class="notice-button" type="button" aria-label="お知らせ" title="お知らせ"></button>
      <a href="./portal.html">社内ポータル</a>
      <a href="./marketplace.html">マーケット</a>
      <a href="./my-apps.html">マイアプリ</a>
    </nav>
    <details class="page-menu" aria-label="マイページ">
      <summary>マイページ</summary>
      <div class="page-menu-list">
        <span>会社名/メアド</span>
        <a href="./account.html">マイページ</a>
        <a href="./support.html">サポート</a>
        <a href="./request.html">開発相談</a>
        <a href="./login.html">ログイン</a>
        <button type="button">ログアウト</button>
      </div>
    </details>
  </header>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>社内ポータルへ移動しています</h1>
    <p>自動で移動しない場合は、下のボタンから社内ポータルを開いてください。</p>
    <a href="./portal.html">社内ポータルを開く</a>
  </main>
</body>
</html>
