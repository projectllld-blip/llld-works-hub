<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./portal.html">
  <title>LLLD Works Hub | 社内ポータル</title>
  <meta name="description" content="LLLD Works Hubの社内ポータル入口です。">
  <style>
    :root{
      color-scheme:light;
      --navy:#061829;
      --teal:#12b8ab;
      --bg:#f2f5f9;
      --line:#dce3ed;
      --text:#2b3850;
      --muted:#6d7b92;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    }
    *{box-sizing:border-box}
    body{
      min-height:100vh;
      margin:0;
      display:grid;
      place-items:center;
      padding:24px;
      background:var(--bg);
      color:var(--text);
      font-family:var(--font);
      line-height:1.7;
    }
    main{
      width:min(520px,100%);
      padding:28px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      box-shadow:0 14px 34px rgba(6,24,41,.08);
      text-align:center;
    }
    .mark{
      width:42px;
      height:42px;
      margin:0 auto 14px;
      border-radius:12px;
      background:linear-gradient(135deg,#3acde8,var(--teal));
    }
    h1{
      margin:0 0 8px;
      color:var(--navy);
      font-size:1.7rem;
      line-height:1.3;
    }
    p{margin:0 0 18px;color:var(--muted)}
    a{
      display:inline-flex;
      min-height:42px;
      align-items:center;
      justify-content:center;
      padding:0 18px;
      border-radius:10px;
      background:var(--teal);
      color:#fff;
      font-weight:700;
      text-decoration:none;
    }
  </style>
  <script>
    window.location.replace("./portal.html");
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>社内ポータルへ移動しています</h1>
    <p>自動で移動しない場合は、下のボタンから社内ポータルを開いてください。</p>
    <a href="./portal.html">社内ポータルを開く</a>
  </main>
</body>
</html>
