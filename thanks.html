<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>送信ありがとうございます | LLLD Works Market β</title>
  <meta name="description" content="LLLD Works Market βのお問い合わせ・購入後案内">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body data-market-page="thanks">
  <main class="market-page">
    <header class="market-header">
      <a class="market-brand" href="./marketplace.html">LLLD Works Market</a>
      <nav aria-label="共通導線">
        <a href="./portal.html">社内ポータル</a>
        <a href="./marketplace.html">マーケット</a>
        <a href="./my-apps.html">マイアプリ</a>
        <button class="market-notice-button" type="button" data-market-notice-link aria-label="お知らせ" title="お知らせ">
          <span class="market-notice-dot" aria-hidden="true"></span>
          <span class="market-notice-count" aria-hidden="true">3</span>
        </button>
      </nav>
      <details class="account-session-menu" aria-label="マイページ">
        <summary>マイページ</summary>
        <div class="account-session-menu-list">
          <span class="account-session-info" data-account-badge>確認中</span>
          <a href="./account.html">マイページ</a>
          <a href="./support.html">サポート</a>
          <a href="./request.html">開発相談</a>
          <button type="button" data-account-logout>ログアウト</button>
        </div>
      </details>
    </header>

    <section class="thanks-panel" id="thanksContent">
      <span class="market-kicker" id="thanksKicker">送信完了</span>
      <h1 id="thanksTitle">送信ありがとうございます。</h1>
      <p id="thanksLead">内容を確認して、手動で連絡します。</p>

      <div class="detail-lp-grid">
        <article class="detail-panel">
          <h2 id="thanksPrimaryHeading">次の流れ</h2>
          <ul id="thanksPrimaryList"></ul>
        </article>

        <article class="detail-panel">
          <h2 id="thanksSecondaryHeading">確認事項</h2>
          <ul id="thanksSecondaryList"></ul>
        </article>
      </div>

      <div class="detail-cta-row">
        <a class="btn primary" href="./marketplace.html">マーケットへ戻る</a>
        <a class="btn secondary" href="./request.html">追加で相談する</a>
      </div>
    </section>
  </main>
  <script src="./assets/js/siteConfigService.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabaseClientService.js"></script>
  <script src="./assets/js/authService.js"></script>
  <script src="./assets/js/accountHeader.js"></script>
  <script src="./assets/js/thanksPage.js"></script>
</body>
</html>
