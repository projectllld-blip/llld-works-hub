<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="SeatFlow 座席管理アプリの画面モック" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fbff"/>
      <stop offset=".52" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#f3fff9"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b2745"/>
      <stop offset="1" stop-color="#07182d"/>
    </linearGradient>
    <linearGradient id="seatBlue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="seatGreen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="seatPink" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="seatAmber" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#102033" flood-opacity=".18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#102033" flood-opacity=".16"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#dce7f3" stroke-width="1"/>
    </pattern>
    <style>
      .title{font-weight:900;fill:#102033}
      .muted{fill:#64748b;font-weight:700}
      .tiny{font-size:12px}
      .label{font-size:15px;font-weight:900}
      .seatText{font-size:15px;font-weight:900;fill:white;text-anchor:middle}
    </style>
  </defs>

  <rect width="960" height="540" rx="34" fill="url(#pageBg)"/>
  <rect x="36" y="34" width="888" height="444" rx="28" fill="#fff" filter="url(#cardShadow)"/>
